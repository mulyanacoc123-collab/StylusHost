<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stylus Client Test</title>
<style>
  body{margin:0;background:#111;color:#eee;font-family:sans-serif}
  #bar{padding:8px} canvas{width:100%;display:block;touch-action:none}
</style>
<div id="bar">ws:// <input id="host" value="192.168.43.1:8080">
  <button id="go">Connect</button> <button id="clr">Clear</button> <button id="undo">Undo</button>
  <span id="st"></span></div>
<canvas id="c" width="960" height="540"></canvas>
<script>
let ws; const c = document.getElementById('c'), g = c.getContext('2d');
go.onclick = () => {
  ws = new WebSocket('ws://' + host.value);
  ws.onopen = () => st.textContent = 'connected';
  ws.onclose = () => st.textContent = 'closed';
  ws.onmessage = async e => {
    if (typeof e.data === 'string') return;          // pesan "hello"
    const bmp = await createImageBitmap(e.data);     // frame JPEG
    if (c.width !== bmp.width || c.height !== bmp.height) { c.width = bmp.width; c.height = bmp.height; }
    g.drawImage(bmp, 0, 0); bmp.close();
  };
};
clr.onclick  = () => ws && ws.send(JSON.stringify({type: 'clear'}));
undo.onclick = () => ws && ws.send(JSON.stringify({type: 'undo'}));
function send(a, e) {
  if (!ws || ws.readyState !== 1) return;
  const r = c.getBoundingClientRect();
  ws.send(JSON.stringify({type: 'stylus', action_type: a,
    x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height,
    pressure: e.pressure || 0.5}));
}
c.onpointerdown = e => { c.setPointerCapture(e.pointerId); send('DOWN', e); };
c.onpointermove = e => { if (e.buttons) send('MOVE', e); };
c.onpointerup   = e => send('UP', e);
</script>
